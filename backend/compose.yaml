services:
  loomora-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loomora-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:4000:4000"
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 150
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
